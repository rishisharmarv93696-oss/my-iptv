name: Update M3U

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download playlists
        run: |
          curl -L https://iptv-org.github.io/iptv/languages/hin.m3u -o hindi.m3u
          curl -L https://iptv-org.github.io/iptv/languages/bho.m3u -o bhojpuri.m3u
          curl -L https://iptv-org.github.io/iptv/languages/pan.m3u -o punjabi.m3u

      - name: Combine playlists
        run: |
          echo "#EXTM3U" > combined.m3u
          grep -v '^#EXTM3U' hindi.m3u >> combined.m3u
          grep -v '^#EXTM3U' bhojpuri.m3u >> combined.m3u
          grep -v '^#EXTM3U' punjabi.m3u >> combined.m3u

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combined.m3u
          git diff --cached --quiet || git commit -m "Auto update M3U"
          git push
